name: Mirror to git.yygu.cn

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release*'
    tags:
      - '*'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mirror SSH key
        env:
          SSH_KEY: ${{ secrets.YYGU_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 git.yygu.cn >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push mirror
        run: |
          git remote add mirror git@git.yygu.cn:corekg/lework.git
          git push --prune mirror main \
            'refs/heads/release*:refs/heads/release*' \
            'refs/tags/*:refs/tags/*' --force
