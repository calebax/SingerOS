name: Mirror to git.yygu.cn

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release*'
    tags:
      - '*'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mirror SSH key
        env:
          SSH_KEY: ${{ secrets.YYGU_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 git.yygu.cn >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push mirror
        run: |
          git remote add mirror git@git.yygu.cn:corekg/lework.git
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
          # 主分支（单 ref，避免通配 refspec 让服务端 enumerate 卡死）
          git push --force mirror main
          # tag
          git push --force --tags mirror
          # release* 分支：逐个 push，避免通配 refspec
          for b in $(git for-each-ref --format='%(refname:short)' refs/heads/release\*); do
            git push --force mirror "refs/heads/$b:refs/heads/$b"
          done
